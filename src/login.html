<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>לוס אנג'לס 2026 · כניסה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --petrol:#0F2A33; --paper:#FAF7F0; --hivis:#F2C230; --signal:#D94E28; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--petrol);color:var(--paper);font-family:'Assistant',-apple-system,'Segoe UI',Arial,sans-serif;font-size:17px;line-height:1.6;display:grid;place-items:center;padding:24px}
  .inner{max-width:420px;width:100%;text-align:center}
  h1{font-family:'Rubik',-apple-system,Arial,sans-serif;font-weight:900;font-size:34px;letter-spacing:-.01em;line-height:1.2;margin:0}
  .sub{color:#93A9AF;margin:8px 0 30px;font-size:16px}

  .pick{display:grid;gap:12px}
  .pick button{background:none;border:2px solid #2C5866;color:var(--paper);padding:20px;font-family:'Rubik';font-weight:700;font-size:21px;cursor:pointer;text-align:right;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%}
  .pick button span{font-family:'Assistant';font-weight:400;font-size:14px;color:#93A9AF}
  .pick button:hover,.pick button:focus-visible{border-color:var(--hivis);outline:none}
  .pick button.on{border-color:var(--hivis)}

  form{display:none;margin-top:22px;text-align:right}
  form.on{display:block}
  label{display:block;font-weight:700;font-size:15px;margin:0 0 6px;color:#93A9AF}
  input{width:100%;padding:16px;font-family:'Assistant';font-size:18px;background:#0A1F26;border:2px solid #2C5866;color:var(--paper)}
  input:focus{border-color:var(--hivis);outline:none}
  .go{margin-top:12px;width:100%;background:var(--hivis);color:var(--petrol);border:0;padding:18px;font-family:'Rubik';font-weight:900;font-size:19px;cursor:pointer}
  .go[disabled]{opacity:.5;cursor:default}
  .err{margin-top:12px;color:var(--signal);font-weight:700;font-size:15px;min-height:22px;text-align:center}
  .back{margin-top:16px;background:none;border:0;color:#93A9AF;font-family:'Assistant';font-size:15px;cursor:pointer;text-decoration:underline;width:100%}
  @media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>

<div class="inner">
  <h1>לוס אנג'לס 2026</h1>
  <p class="sub" id="sub">23 בספטמבר עד 5 באוקטובר · מי אתה?</p>

  <div class="pick" id="pick">
    <button type="button" data-u="effi">אפי<span>עבודה, יגאל, לוגיסטיקה</span></button>
    <button type="button" data-u="ben">בן<span>למידה, המשימה, יומן</span></button>
  </div>

  <form id="form" autocomplete="on">
    <input type="hidden" name="username" id="username" autocomplete="username">
    <label for="password">הסיסמה שלך</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <button type="submit" class="go" id="go">כניסה</button>
    <div class="err" id="err" role="alert" aria-live="polite"></div>
    <button type="button" class="back" id="back">חזרה לבחירת משתמש</button>
  </form>
</div>

<script>
(function(){
  "use strict";
  var NAMES = { effi: "אפי", ben: "בן" };
  var user = null;

  var pick = document.getElementById('pick');
  var form = document.getElementById('form');
  var sub  = document.getElementById('sub');
  var err  = document.getElementById('err');
  var go   = document.getElementById('go');
  var pw   = document.getElementById('password');

  function choose(u){
    user = u;
    document.getElementById('username').value = u;
    sub.textContent = NAMES[u] + ' · הזן סיסמה';
    Array.prototype.forEach.call(pick.querySelectorAll('button'), function(b){
      b.classList.toggle('on', b.dataset.u === u);
    });
    form.classList.add('on');
    err.textContent = '';
    pw.value = '';
    pw.focus();
  }

  function reset(){
    user = null;
    form.classList.remove('on');
    sub.textContent = "23 בספטמבר עד 5 באוקטובר · מי אתה?";
    Array.prototype.forEach.call(pick.querySelectorAll('button'), function(b){
      b.classList.remove('on');
    });
  }

  pick.addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (b) choose(b.dataset.u);
  });

  document.getElementById('back').addEventListener('click', reset);

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    if (!user) return;
    go.disabled = true;
    err.textContent = '';
    try{
      var res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user: user, password: pw.value })
      });
      if (res.ok) { window.location.replace('/'); return; }
      err.textContent = res.status === 401 ? 'סיסמה שגויה' : 'משהו נתקע. נסה שוב.';
    }catch(_){
      err.textContent = 'אין חיבור לרשת. נסה שוב.';
    }
    go.disabled = false;
    pw.select();
  });
})();
</script>
</body>
</html>
